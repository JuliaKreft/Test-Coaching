---
layout: default
---
<div class="tab-content active">
  <article class="post-wrap">
    <a href="{% if page.lang == 'en' %}/en/blog/{% else %}/blog/{% endif %}" style="color:var(--pink);text-decoration:none;font-size:.9rem;">&larr; {% if page.lang == 'en' %}Back to blog{% else %}Zurück zum Blog{% endif %}</a>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%d.%m.%Y" }}</div>
    <div class="post-body">{{ content }}</div>
  </article>
</div>
